name: Test

on: [push, pull_request]

env:
  CLIRM_READONLY: "1"

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade uv
          uv sync --locked
      - name: Unit tests
        run: .venv/bin/python -m pytest -q
