}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id="geomys-localities-map"&gt;
  &lt;div class="map-wrap" aria-label="Map of type localities and molecular sampling sites for the Geomys breviceps complex"&gt;
    &lt;svg class="locality-map" viewBox="0 0 900 650" role="img" aria-labelledby="geomys-map-title geomys-map-desc"&gt;
      &lt;title id="geomys-map-title"&gt;Type localities and molecular sampling sites for the Geomys breviceps complex&lt;/title&gt;
      &lt;desc id="geomys-map-desc"&gt;County map of Texas, Oklahoma, Arkansas, and Louisiana with seven type localities and thirty-nine molecular samples from Bradley and colleagues 2023 and Halsey and colleagues 2025.&lt;/desc&gt;
    &lt;/svg&gt;
    &lt;div class="tooltip" hidden&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="viz-row legend text-small" aria-label="Map legend"&gt;
    &lt;span&gt;&lt;i class="legend-star"&gt;★&lt;/i&gt; type locality&lt;/span&gt;
    &lt;span&gt;&lt;i class="legend-dot clade-i"&gt;&lt;/i&gt; Bradley clade I&lt;/span&gt;
    &lt;span&gt;&lt;i class="legend-dot clade-ii"&gt;&lt;/i&gt; Bradley clade II&lt;/span&gt;
    &lt;span&gt;&lt;i class="legend-square halsey"&gt;&lt;/i&gt; Halsey et al. 2025&lt;/span&gt;
    &lt;span class="text-muted"&gt;Marker labels give individuals at a site when n &amp;gt; 1&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class="selected text-small" aria-live="polite"&gt;Bradley et al.: 7 samples in clade I and 14 in clade II. Hover over or select a marker for locality and vouchers.&lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #geomys-localities-map { width: 100%; color: var(--foreground); }
  #geomys-localities-map .map-wrap { position: relative; width: 100%; }
  #geomys-localities-map .locality-map { display: block; width: 100%; height: auto; }
  #geomys-localities-map .county { fill: color-mix(in srgb, var(--muted) 48%, transparent); stroke: color-mix(in srgb, var(--border) 58%, transparent); stroke-width: .45; }
  #geomys-localities-map .state { fill: none; stroke: var(--foreground); stroke-width: 1.4; }
  #geomys-localities-map .state-label { fill: var(--muted-foreground); font-weight: 500; letter-spacing: .08em; }
  #geomys-localities-map .type-mark { fill: var(--viz-series-3); stroke: var(--background); stroke-width: 1.6; cursor: pointer; }
  #geomys-localities-map .clade-i-mark { fill: var(--viz-series-1); stroke: var(--background); stroke-width: 1.4; cursor: pointer; }
  #geomys-localities-map .clade-ii-mark { fill: var(--viz-series-4); stroke: var(--background); stroke-width: 1.4; cursor: pointer; }
  #geomys-localities-map .halsey-mark { fill: var(--muted-foreground); stroke: var(--background); stroke-width: 1.4; cursor: pointer; }
  #geomys-localities-map .count-label { fill: var(--background); font-weight: 500; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  #geomys-localities-map .type-label { fill: var(--foreground); font-weight: 500; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
  #geomys-localities-map .leader { stroke: var(--muted-foreground); stroke-width: 1; fill: none; }
  #geomys-localities-map .legend { justify-content: flex-start; gap: 1rem; margin-top: .5rem; }
  #geomys-localities-map .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  #geomys-localities-map .legend-star { color: var(--viz-series-3); font-style: normal; }
  #geomys-localities-map .legend-dot, #geomys-localities-map .legend-square { width: .7rem; height: .7rem; display: inline-block; }
  #geomys-localities-map .legend-dot { border-radius: 50%; }

  #geomys-localities-map .tooltip { position: absolute; pointer-events: none; max-width: 300px; }

&lt;script type="module"&gt;
  import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
  import { feature, mesh } from "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm";
  import us from "https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json/+esm";

  const root = document.getElementById("geomys-localities-map");
  const svg = d3.select(root.querySelector("svg"));
  const tooltip = root.querySelector(".tooltip");
  const selected = root.querySelector(".selected");
  const stateIds = new Set(["05", "22", "40", "48"]);
  const allStates = feature(us, us.objects.states).features;
  const states = allStates.filter(d =&gt; stateIds.has(String(d.id).padStart(2, "0")));
  const stateCollection = { type: "FeatureCollection", features: states };
  const counties = feature(us, us.objects.counties).features.filter(d =&gt; stateIds.has(String(d.id).padStart(5, "0").slice(0, 2)));
  const projection = d3.geoAlbers().fitExtent([[36, 28], [864, 620]], stateCollection);
  const path = d3.geoPath(projection);

  const points = [
    {kind:"type",study:"type locality",name:"Geomys breviceps",locality:"Prairie Mer Rouge, Morehouse Parish, Louisiana",lat:32.775135,lon:-91.792626,n:1,vouchers:"USNM:MAMM:156",label:"breviceps",dx:-80,dy:-13},
    {kind:"type",study:"type locality",name:"Geomys breviceps sagittalis",locality:"Clear Creek, Galveston Bay, Texas",lat:29.507454,lon:-95.094930,n:1,vouchers:"USNM:MAMM:32936",label:"sagittalis",dx:-80,dy:38},
    {kind:"type",study:"type locality",name:"Geomys breviceps brazensis",locality:"5 mi E Kurten, Grimes County, Texas",lat:30.787110,lon:-96.179891,n:1,vouchers:"TCWC:Mamm:537",label:"brazensis",dx:-80,dy:-18},
    {kind:"type",study:"type locality",name:"Geomys breviceps dutcheri",locality:"Fort Gibson, Muskogee County, Oklahoma",lat:35.797546,lon:-95.250341,n:1,vouchers:"USNM:MAMM:64591",label:"dutcheri",dx:13,dy:-16},
    {kind:"type",study:"type locality",name:"Geomys breviceps ludemani",locality:"7 mi SW Fannett, Jefferson County, Texas",lat:29.854375,lon:-94.333046,n:1,vouchers:"TCWC:Mamm:1135",label:"ludemani",dx:16,dy:-28},
    {kind:"type",study:"type locality",name:"Geomys breviceps pratincolus",locality:"2 mi E Liberty, Liberty County, Texas",lat:30.060910,lon:-94.763736,n:1,vouchers:"TCWC:Mamm:1128",label:"pratincolus",dx:18,dy:4},
    {kind:"type",study:"type locality",name:"Geomys breviceps terricolus",locality:"1 mi N Texas City, Galveston County, Texas",lat:29.410486,lon:-94.917548,n:1,vouchers:"TCWC:Mamm:624",label:"terricolus",dx:18,dy:30},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps",locality:"3 mi NW Alleene, Little River County, Arkansas",lat:33.802058,lon:-94.298694,n:2,vouchers:"LVT5500, UALR4532"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps",locality:"3.1 mi and 5.0 km E Bastrop, Morehouse Parish, Louisiana",lat:32.778129,lon:-91.863972,n:2,vouchers:"LSUMZ31603, Demastes 1994 / L28733"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps",locality:"Collinston, Morehouse Parish, Louisiana",lat:32.690970,lon:-91.871794,n:1,vouchers:"Demastes 1994 / L28734"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps",locality:"3.5 mi SE Quitman, Wood County, Texas",lat:32.759998,lon:-95.402000,n:1,vouchers:"TTU69299"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"I",name:"Geomys breviceps brazensis",locality:"5.81 mi E Kurten, Grimes County, Texas",lat:30.815100,lon:-96.170800,n:2,vouchers:"TTU143407, TTU143408"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps dutcheri",locality:"Fort Gibson Historic Site, Muskogee County, Oklahoma",lat:35.804300,lon:-95.257800,n:2,vouchers:"TTU143398, TTU143399"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"I",name:"Geomys breviceps pratincolus",locality:"0.5 mi E Livingston, Polk County, Texas",lat:30.710583,lon:-94.927350,n:1,vouchers:"TTU143428"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps sagittalis",locality:"2 mi S, 3 mi W Rosepine, Vernon Parish, Louisiana",lat:30.890181,lon:-93.333003,n:1,vouchers:"LSUMZ30723"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps sagittalis",locality:"0.5–0.8 km N Ranger Station, Vernon Parish, Louisiana",lat:30.992078,lon:-93.156999,n:3,vouchers:"LSUMZ29336, LSUMZ29337, Demastes 1994 / L28736"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps sagittalis",locality:"1.4 km S Kirbyville, Jasper County, Texas",lat:30.647891,lon:-93.892681,n:1,vouchers:"Demastes 1994 / L28738"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"II",name:"Geomys breviceps sagittalis",locality:"6.8 km N Lindale, Smith County, Texas",lat:32.576851,lon:-95.409400,n:1,vouchers:"Demastes 1994 / L28737"},
    {kind:"sample",study:"Bradley et al. 2023",clade:"I",name:"Geomys breviceps sagittalis",locality:"Reagan, Falls County, Texas",lat:31.210471,lon:-96.771250,n:4,vouchers:"TTU119230, TTU155642, TTU155643, TTU119231"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys bursarius brazensis",locality:"5.81 mi E Kurten, Grimes County, Texas",lat:30.814783,lon:-96.171090,n:7,vouchers:"TK200288–TK200293, TK200443"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys bursarius brazensis",locality:"7.99 mi SE Kurten, Grimes County, Texas",lat:30.716467,lon:-96.157350,n:1,vouchers:"TK200444"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys bursarius dutcheri",locality:"Fort Gibson Historic Site, Muskogee County, Oklahoma",lat:35.804300,lon:-95.257800,n:5,vouchers:"TK200185–TK200189"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys breviceps sagittalis",locality:"1.5 mi W Maysfield, Milam County, Texas",lat:30.922001,lon:-96.844002,n:1,vouchers:"TK24932"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys breviceps sagittalis",locality:"3.5 mi SE Quitman, Wood County, Texas",lat:32.759998,lon:-95.402000,n:1,vouchers:"TK48934"},
    {kind:"sample",study:"Halsey et al. 2025",name:"Geomys breviceps sagittalis",locality:"Quitman area, Wood County, Texas (paper and catalogue directions conflict)",lat:32.797001,lon:-95.408997,n:3,vouchers:"TK48935, TK48940, TK48939"}
  ];

  svg.append("g").selectAll("path").data(counties).join("path").attr("class", "county").attr("d", path);
  svg.append("path").datum(mesh(us, us.objects.states, (a, b) =&gt; a !== b &amp;&amp; stateIds.has(String(a.id).padStart(2, "0")) &amp;&amp; stateIds.has(String(b.id).padStart(2, "0")))).attr("class", "state").attr("d", path);
  svg.append("g").selectAll("path").data(states).join("path").attr("class", "state").attr("d", path);

  const stateNames = new Map([["05", "AR"], ["22", "LA"], ["40", "OK"], ["48", "TX"]]);
  svg.append("g").selectAll("text").data(states).join("text")
    .attr("class", "state-label text-small")
    .attr("x", d =&gt; path.centroid(d)[0]).attr("y", d =&gt; path.centroid(d)[1])
    .attr("text-anchor", "middle").text(d =&gt; stateNames.get(String(d.id).padStart(2, "0")));

  function selectPoint(d) {
    const clade = d.clade ? `, clade ${d.clade}` : "";
    selected.textContent = `${d.study}${clade} — ${d.name}; ${d.locality}; ${d.vouchers}${d.n &gt; 1 ? ` (${d.n} individuals)` : ""}.`;
  }

  function showTip(event, d) {
    selectPoint(d);
    tooltip.hidden = false;
    tooltip.textContent = `${d.locality} · ${d.vouchers}`;
    const box = root.querySelector(".map-wrap").getBoundingClientRect();
    const mark = event.currentTarget.getBoundingClientRect();
    const left = Math.max(8, Math.min(box.width - 308, mark.left - box.left + mark.width / 2 + 10));
    const top = Math.max(8, mark.top - box.top - 18);
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function hideTip() { tooltip.hidden = true; }

  const samples = points.filter(d =&gt; d.kind === "sample");
  const sampleGroups = svg.append("g").selectAll("g").data(samples).join("g")
    .attr("transform", d =&gt; {
      const [x, y] = projection([d.lon, d.lat]);
      const shift = d.study.startsWith("Bradley") ? -4 : 4;
      return `translate(${x + shift},${y})`;
    });

  sampleGroups.each(function(d) {
    const g = d3.select(this);
    const size = 42 + Math.sqrt(d.n) * 26;
    if (d.study.startsWith("Bradley")) {
      g.append("path").attr("class", d.clade === "I" ? "clade-i-mark" : "clade-ii-mark").attr("d", d3.symbol().type(d3.symbolCircle).size(size)());
    } else {
      g.append("path").attr("class", "halsey-mark").attr("d", d3.symbol().type(d3.symbolSquare).size(size)());
    }
    if (d.n &gt; 1) g.append("text").attr("class", "count-label text-small").text(d.n);
  });
  sampleGroups.attr("aria-label", d =&gt; `${d.study}${d.clade ? `, clade ${d.clade}` : ""}, ${d.locality}, ${d.n} individuals`)
    .on("mouseenter", showTip).on("mouseleave", hideTip).on("click", (event, d) =&gt; selectPoint(d));

  const types = points.filter(d =&gt; d.kind === "type");
  const typeGroups = svg.append("g").selectAll("g").data(types).join("g")
    .attr("transform", d =&gt; {
      const [x, y] = projection([d.lon, d.lat]);
      return `translate(${x},${y})`;
    });
  typeGroups.append("path").attr("class", "type-mark").attr("d", d3.symbol().type(d3.symbolStar).size(190)());
  typeGroups.attr("aria-label", d =&gt; `Type locality of ${d.name}, ${d.locality}`)
    .on("mouseenter", showTip).on("mouseleave", hideTip).on("click", (event, d) =&gt; selectPoint(d));

  const labels = svg.append("g").selectAll("g").data(types).join("g");
  labels.append("path").attr("class", "leader").attr("d", d =&gt; {
    const [x, y] = projection([d.lon, d.lat]);
    return `M${x},${y}L${x + d.dx * .72},${y + d.dy * .72}`;
  });
  labels.append("text").attr("class", "type-label text-small")
    .attr("x", d =&gt; projection([d.lon, d.lat])[0] + d.dx)
    .attr("y", d =&gt; projection([d.lon, d.lat])[1] + d.dy)
    .attr("text-anchor", d =&gt; d.dx &lt; 0 ? "end" : "start")
    .text(d =&gt; d.label);
&lt;/script&gt;

&lt;script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"&gt;&lt;/script&gt;
&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
